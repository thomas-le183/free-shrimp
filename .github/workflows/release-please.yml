name: release-please

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # dev cuts rc prereleases, main cuts stable releases. The two branches use
      # separate config/manifest pairs so their release PRs never rewrite the same
      # files and collide on merge.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'dev' && 'release-please-config.dev.json' || 'release-please-config.json' }}
          manifest-file: ${{ github.ref_name == 'dev' && '.release-please-manifest.dev.json' || '.release-please-manifest.json' }}

  # release-please creates the tag and the GitHub Release with GITHUB_TOKEN, and
  # GitHub suppresses workflow triggers on refs pushed by that token — so a
  # separate `on: push: tags` workflow would never fire. Attach the artifacts to
  # the release release-please just made instead.
  artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Build artifacts
        run: scripts/build-artifacts.sh "${{ needs.release-please.outputs.tag_name }}"

      - name: Upload artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            dist/hello-"$TAG".txt \
            dist/free-shrimp-"$TAG".tar.gz \
            dist/SHA256SUMS \
            --clobber
